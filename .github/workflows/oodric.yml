name: Oodriç real-program probe

on:
  push:
    branches:
      - Oodriç
  workflow_dispatch:

jobs:
  compile-icu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ICU
        uses: actions/checkout@v4

      - name: Checkout Oodriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: b7ac1eea7adca7c44a68d465a24a55c8e0830c4c
          path: .tools/Idric

      - name: Checkout Idric-Net
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric-Net
          ref: 3e7643c8d8dd2a940d5b6dc96403ddae765402cd
          path: .tools/Idric-Net

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libssl-dev

      - name: Build Oodriç compiler
        run: make -C "$GITHUB_WORKSPACE/.tools/Idric" bootstrap SCHEME=scheme

      - name: Install Idric-Net
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: |
          cd "$GITHUB_WORKSPACE/.tools/Idric-Net"
          "$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2" --install idric-net.ipkg

      - name: Compile native behavior oracle
        run: make check-native

      - name: Compile ICU with Oodriç
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: make IDRIC="$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2"
