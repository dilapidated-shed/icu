name: Idric mail type sketches

on:
  push:
    branches:
      - idric-mail-type-sketches
  pull_request:

jobs:
  typecheck-mail-sketches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ICU
        uses: actions/checkout@v4
      - name: Checkout pinned Idric compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 61970be77769f607cca8650bf424c0f0b22ddee7
          path: .tools/Idric
      - name: Install Scheme bootstrap dependency
        run: sudo apt-get update && sudo apt-get install -y chezscheme
      - name: Build pinned Idric compiler
        run: make -C .tools/Idric bootstrap SCHEME=scheme
      - name: Typecheck RemoteSource independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check RemoteSource.idric
      - name: Typecheck Mbox independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check Mbox.idric
      - name: Typecheck RfcMessage independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check RfcMessage.idric
      - name: Typecheck Provenance independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check Provenance.idric
      - name: Typecheck GmailImport independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check GmailImport.idric
      - name: Typecheck MigrationState independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check MigrationState.idric
      - name: Typecheck Streaming independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check Streaming.idric
      - name: Typecheck ArchiveCopy independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check ArchiveCopy.idric
      - name: Typecheck Acceptance independently
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        working-directory: examples/autogenerated/mail-type-sketches
        run: ../../../.tools/Idric/build/exec/idris2 --check Acceptance.idric
