name: Idric end to end

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  idric-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ICU
        uses: actions/checkout@v4

      - name: Checkout Idric compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 61970be77769f607cca8650bf424c0f0b22ddee7
          path: .tools/Idric

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libssl-dev

      - name: Build Idric compiler
        run: |
          make -C "$GITHUB_WORKSPACE/.tools/Idric" bootstrap SCHEME=scheme
          "$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2" --version

      - name: Compile ICU through Idric
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: |
          make check-native
          make IDRIC="$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2"

      - name: Start deterministic HTTP and HTTPS servers
        run: |
          mkdir -p "$RUNNER_TEMP/icu-tls"
          cd "$RUNNER_TEMP/icu-tls"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ca.key -out ca.pem -days 1 \
            -subj '/CN=ICU test CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr \
            -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr \
            -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out server.pem -days 1 -extfile server.ext

          cat > "$RUNNER_TEMP/icu-server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import ssl
          import threading
          import time

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def log_message(self, format, *args):
                  pass

              def reply(self, body):
                  encoded = body.encode("ascii")
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              def do_GET(self):
                  self.reply("GET " + self.path)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length).decode("ascii")
                  self.reply("POST " + self.path + " " + body)

          plain = ThreadingHTTPServer(("127.0.0.1", 18080), Handler)
          secure = ThreadingHTTPServer(("127.0.0.1", 18443), Handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(
              "${RUNNER_TEMP}/icu-tls/server.pem",
              "${RUNNER_TEMP}/icu-tls/server.key",
          )
          secure.socket = context.wrap_socket(secure.socket, server_side=True)

          threading.Thread(target=plain.serve_forever, daemon=True).start()
          threading.Thread(target=secure.serve_forever, daemon=True).start()
          while True:
              time.sleep(60)
          PY
          sed -i "s|\${RUNNER_TEMP}|$RUNNER_TEMP|g" "$RUNNER_TEMP/icu-server.py"
          python3 "$RUNNER_TEMP/icu-server.py" > "$RUNNER_TEMP/icu-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/icu-server.pid"
          sleep 1

      - name: Run compiled GET and POST over HTTP and verified HTTPS
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/icu-tls/ca.pem
        run: |
          test "$(./build/exec/icu get http://127.0.0.1:18080/plain?x=1)" = 'GET /plain?x=1'
          test "$(./build/exec/icu post http://127.0.0.1:18080/post hello)" = 'POST /post hello'
          test "$(./build/exec/icu get https://localhost:18443/secure)" = 'GET /secure'
          test "$(./build/exec/icu post https://localhost:18443/secure-post hello)" = 'POST /secure-post hello'

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/icu-server.log" 2>/dev/null || true
