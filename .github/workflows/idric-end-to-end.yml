name: Idric end to end

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  idric-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ICU
        uses: actions/checkout@v4

      - name: Checkout Idric compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: 47557b43053c829d4f8aa1581007002b57f9c59f
          path: .tools/Idric

      - name: Checkout Idric-Net
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric-Net
          ref: d1193f24341b7d7af5a10b2b2aa1bf57c535c08e
          path: .tools/Idric-Net

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libssl-dev

      - name: Build Idric compiler
        run: |
          make -C "$GITHUB_WORKSPACE/.tools/Idric" bootstrap SCHEME=scheme
          "$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2" --version

      - name: Install Idric-Net package
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: |
          cd "$GITHUB_WORKSPACE/.tools/Idric-Net"
          "$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2" --install idric-net.ipkg

      - name: Compile ICU through Idric
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: |
          make check-native
          make IDRIC="$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2"

      - name: Run pure Idric HTTP model tests
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/bootstrap-build
        run: |
          "$GITHUB_WORKSPACE/.tools/Idric/build/exec/idris2" -p idric_net tests/HttpTests.idric -o icu-http-tests
          ./build/exec/icu-http-tests

      - name: Start deterministic HTTP and HTTPS servers
        run: |
          mkdir -p "$RUNNER_TEMP/icu-tls"
          cd "$RUNNER_TEMP/icu-tls"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ca.key -out ca.pem -days 1 \
            -subj '/CN=ICU test CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr \
            -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr \
            -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out server.pem -days 1 -extfile server.ext

          cat > "$RUNNER_TEMP/icu-server.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import ssl
          import threading
          import time

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.0"

              def log_message(self, format, *args):
                  pass

              def reply_bytes(self, body, content_type="application/octet-stream"):
                  self.send_response(200)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def reply(self, body):
                  self.reply_bytes(body.encode("utf-8"), "text/plain; charset=utf-8")

              def redirect(self, status, location):
                  self.send_response(status)
                  self.send_header("Location", location)
                  self.end_headers()

              def do_GET(self):
                  if self.path == "/redirect/start":
                      self.redirect(302, "/redirect/middle")
                  elif self.path == "/redirect/middle":
                      self.redirect(
                          301,
                          "http://127.0.0.1:18080/redirect/final?via=absolute#ignored",
                      )
                  elif self.path == "/redirect/relative/base":
                      self.redirect(302, "next")
                  elif self.path == "/redirect/loop":
                      self.redirect(302, "/redirect/loop")
                  elif self.path == "/secure-redirect":
                      self.redirect(307, "/secure-final")
                  elif self.path == "/binary":
                      self.reply_bytes(bytes((0, 1, 2, 255, 10, 13)))
                  else:
                      self.reply("GET " + self.path)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length).decode("utf-8")
                  self.reply("POST " + self.path + " " + body)

          plain = ThreadingHTTPServer(("127.0.0.1", 18080), Handler)
          secure = ThreadingHTTPServer(("127.0.0.1", 18443), Handler)
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          context.load_cert_chain(
              "${RUNNER_TEMP}/icu-tls/server.pem",
              "${RUNNER_TEMP}/icu-tls/server.key",
          )
          secure.socket = context.wrap_socket(secure.socket, server_side=True)

          threading.Thread(target=plain.serve_forever, daemon=True).start()
          threading.Thread(target=secure.serve_forever, daemon=True).start()
          while True:
              time.sleep(60)
          PY
          sed -i "s|\${RUNNER_TEMP}|$RUNNER_TEMP|g" "$RUNNER_TEMP/icu-server.py"
          python3 "$RUNNER_TEMP/icu-server.py" > "$RUNNER_TEMP/icu-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/icu-server.pid"
          sleep 1

      - name: Run compiled HTTP, HTTPS, redirect, binary, and UTF-8 checks
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/icu-tls/ca.pem
        run: |
          test "$(./build/exec/icu get http://127.0.0.1:18080/plain?x=1)" = 'GET /plain?x=1'
          test "$(./build/exec/icu post http://127.0.0.1:18080/post café)" = 'POST /post café'
          test "$(./build/exec/icu get https://localhost:18443/secure)" = 'GET /secure'
          test "$(./build/exec/icu post https://localhost:18443/secure-post hello)" = 'POST /secure-post hello'

          test "$(./build/exec/icu get http://127.0.0.1:18080/redirect/start)" = \
            'GET /redirect/final?via=absolute'
          test "$(./build/exec/icu get http://127.0.0.1:18080/redirect/relative/base)" = \
            'GET /redirect/relative/next'
          test "$(./build/exec/icu get https://localhost:18443/secure-redirect)" = \
            'GET /secure-final'

          ./build/exec/icu get http://127.0.0.1:18080/binary > "$RUNNER_TEMP/icu-binary.out"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "icu-binary.out"
          assert path.read_bytes() == bytes((0, 1, 2, 255, 10, 13))
          PY

          if ./build/exec/icu get http://127.0.0.1:18080/redirect/loop \
              > "$RUNNER_TEMP/icu-loop.out" 2> "$RUNNER_TEMP/icu-loop.err"; then
            echo "redirect loop unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'icu: too many redirects' "$RUNNER_TEMP/icu-loop.err"

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/icu-server.log" 2>/dev/null || true
